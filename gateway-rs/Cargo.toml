[package]
name = "at-gateway-rs"
version = "0.1.0"
edition = "2021"
description = "Tokio edge gateway for at-utility: Redis RESP + provider stream proxy"

[dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
bytes = "1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.1"
tower = "0.5"
anyhow = "1.0"

[[bin]]
name = "at-gateway-rs"
path = "src/main.rs"
