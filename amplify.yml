# Amplify Hosting — withOhm marketing site (Next.js App Router SSR)
# Monorepo: app lives in site/. Platform: WEB_COMPUTE.
version: 1
applications:
  - appRoot: site
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
