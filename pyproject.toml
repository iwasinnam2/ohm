[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "at-utility"
version = "0.1.0"
description = "Unified AI IaaS: LLM routing proxy + agent web ingestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
workers = [
  "playwright>=1.48.0",
  "beautifulsoup4>=4.12.0",
  "html2text>=2024.2.26",
]
billing = [
  "stripe>=11.0.0",
]
mcp = [
  "mcp>=2.0.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
at-utility = "at_utility.main:run"
ohm-mcp = "ohm_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
