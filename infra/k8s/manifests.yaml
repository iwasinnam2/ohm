apiVersion: v1
kind: Namespace
metadata:
  name: at-utility
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: at-utility-config
  namespace: at-utility
data:
  AT_REGION: "us-east-1"
  AT_CACHE_TTL_SECONDS: "3600"
  AT_RATE_LIMIT_RPS: "50"
  AT_RATE_LIMIT_BURST: "100"
  AT_COMPLIANCE_ENFORCE: "true"
  AT_BYOK_ALLOW_ENV_FALLBACK: "false"
  AT_ENV: "production"
  # Web Bot Auth key directory URL sent as Signature-Agent on OhmBot fetches.
  AT_WEB_BOT_AUTH_SIGNATURE_AGENT: "https://api.withohm.dev/.well-known/http-message-signatures-directory"
  INGEST_WORKER_URL: "http://ingest-worker:8090"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  # Stripe live catalog — rate card v2 (created 2026-07-31 by
  # scripts/stripe_create_prices_v2.sh; governance: docs/PRICING.md).
  # Price IDs are not secrets; STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET live
  # in at-utility-secrets.
  STRIPE_PRICE_PAYG: "price_1TzABhGcgCWHk3PJY1qOxTWK"
  STRIPE_PRICE_ENTERPRISE: "price_1TzABoGcgCWHk3PJnjaMEOgv"
  STRIPE_PRICE_METER_CACHE_HIT: "price_1TzABbGcgCWHk3PJns7vI8Ym"
  STRIPE_PRICE_METER_CACHE_MISS: "price_1TzABdGcgCWHk3PJNivDORf1"
  STRIPE_PRICE_METER_WEB_FETCH: "price_1TzABfGcgCWHk3PJdHC0iFzJ"
  STRIPE_PRICE_COMMIT_C29: "price_1TzABjGcgCWHk3PJGy2YbM3M"
  STRIPE_PRICE_COMMIT_C99: "price_1TzABlGcgCWHk3PJYRalEaww"
  STRIPE_PRICE_COMMIT_C499: "price_1TzABmGcgCWHk3PJQmGWXoPU"
  STRIPE_METER_EVENT_CACHE_HIT: "ohm_cache_hit"
  STRIPE_METER_EVENT_CACHE_MISS: "ohm_cache_miss"
  STRIPE_METER_EVENT_WEB_FETCH: "ohm_web_fetch"
  # Stripe Tax is registered (origin: 11a Hughenden Road, BS8 2TT)
  STRIPE_AUTOMATIC_TAX: "true"
  # Single-region posture: REDIS_URL=reader, REDIS_WRITE_URL=primary, REDIS_RL_URL=primary.
  # Secrets must also include AT_RS_REDIS (GET), AT_RS_REDIS_WRITE (SET), and
  # AT_EDGE_SHARED_SECRET / AT_RS_EDGE_SECRET (same value — metered edge HITs).
  # Edge-region wiring notes live in infra/runbooks (mesh paused).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: at-utility
spec:
  # replicas intentionally unset — the gateway HPA (Observer reflex layer)
  # owns scale between 1 (idle) and 4 (burst). Setting it here would fight
  # the HPA on every kubectl apply.
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 594161136574.dkr.ecr.us-east-1.amazonaws.com/at-utility/gateway:0.1.9
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: at-utility-config
            - secretRef:
                name: at-utility-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: at-utility
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-rs
  namespace: at-utility
spec:
  # replicas unset — owned by the gateway-rs HPA (min 1 / max 4).
  selector:
    matchLabels:
      app: gateway-rs
  template:
    metadata:
      labels:
        app: gateway-rs
    spec:
      containers:
        - name: gateway-rs
          image: 594161136574.dkr.ecr.us-east-1.amazonaws.com/at-utility/gateway-rs:0.1.9
          ports:
            - containerPort: 8081
          env:
            - name: AT_RS_LISTEN
              value: "0.0.0.0:8081"
            - name: AT_RS_PRIMARY
              value: "http://gateway:8080"
            - name: AT_RS_FALLBACK
              value: "http://gateway:8080"
            - name: AT_RS_REDIS
              valueFrom:
                secretKeyRef:
                  name: at-utility-secrets
                  key: AT_RS_REDIS
            - name: AT_RS_REDIS_WRITE
              valueFrom:
                secretKeyRef:
                  name: at-utility-secrets
                  key: AT_RS_REDIS_WRITE
            - name: AT_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: at-utility-secrets
                  key: AT_API_KEYS
            # Shared secret for metered cache HITs (/internal/edge-hit).
            # Empty/missing => edge full-proxies and Python meters the hit.
            - name: AT_RS_EDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: at-utility-secrets
                  key: AT_EDGE_SHARED_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-rs
  namespace: at-utility
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    # Replace via ACM_CERTIFICATE_ARN env in infra/scripts/k8s_deploy.sh
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "ACM_CERTIFICATE_ARN_PLACEHOLDER"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: gateway-rs
  ports:
    - name: http
      port: 80
      targetPort: 8081
    - name: https
      port: 443
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
  namespace: at-utility
spec:
  # replicas unset — owned by the ingest-worker HPA (min 1 / max 4).
  selector:
    matchLabels:
      app: ingest-worker
  template:
    metadata:
      labels:
        app: ingest-worker
    spec:
      containers:
        - name: ingest
          image: 594161136574.dkr.ecr.us-east-1.amazonaws.com/at-utility/ingest-worker:0.1.9
          ports:
            - containerPort: 8090
          env:
            - name: WORKER_PORT
              value: "8090"
            # Web Bot Auth: OhmBot signs fetches when the seed is present
            # (empty/missing => unsigned fetches, unchanged behavior).
            - name: AT_WEB_BOT_AUTH_ED25519_SEED_B64
              valueFrom:
                secretKeyRef:
                  name: at-utility-secrets
                  key: AT_WEB_BOT_AUTH_ED25519_SEED_B64
                  optional: true
            - name: AT_WEB_BOT_AUTH_SIGNATURE_AGENT
              valueFrom:
                configMapKeyRef:
                  name: at-utility-config
                  key: AT_WEB_BOT_AUTH_SIGNATURE_AGENT
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-worker
  namespace: at-utility
spec:
  selector:
    app: ingest-worker
  ports:
    - port: 8090
      targetPort: 8090
---
# Observer reflex layer: HPAs own replica counts. metrics-server must be
# installed once (infra/scripts/observer_bootstrap.sh) or targets read
# <unknown> and the HPAs hold current scale.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: at-utility
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-rs
  namespace: at-utility
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-rs
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest-worker
  namespace: at-utility
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingest-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quota-allotment
  namespace: at-utility
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: allot
              # Rolled to the git-SHA tag by deploy.yml alongside the
              # deployments — never pin behind the running gateway again.
              image: 594161136574.dkr.ecr.us-east-1.amazonaws.com/at-utility/gateway:0.1.9
              command:
                - python
                - -m
                - at_utility.allotment
              envFrom:
                - configMapRef:
                    name: at-utility-config
                - secretRef:
                    name: at-utility-secrets
              env:
                - name: REDIS_LEADER_URL
                  valueFrom:
                    secretKeyRef:
                      name: at-utility-secrets
                      key: REDIS_WRITE_URL
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "250m"
                  memory: "256Mi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-worker-ingress
  namespace: at-utility
spec:
  podSelector:
    matchLabels:
      app: ingest-worker
  policyTypes:
    - Ingress
  ingress:
    # Only gateway (Python control plane) and same-namespace peers may call ingest.
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: at-utility
      ports:
        - protocol: TCP
          port: 8090
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-rs-pdb
  namespace: at-utility
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway-rs
---
# GitHub Actions deployer (group mapped via EKS access entry, see
# infra/terraform/cicd.tf): may roll images in this namespace, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ohm-deployer
  namespace: at-utility
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # deploy.yml rolls the quota-allotment CronJob image with the deployments.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ohm-deployer
  namespace: at-utility
subjects:
  - kind: Group
    name: ohm-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ohm-deployer
  apiGroup: rbac.authorization.k8s.io
