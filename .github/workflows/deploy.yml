name: Deploy API

# Ships the three API images to EKS with zero local tooling. Authenticates to
# AWS via OIDC (role ohm-github-deployer, master-only trust); images are tagged
# with the immutable git SHA; the rollout is verified and the live /health
# endpoint is checked before the run goes green.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "workers/**"
      - "gateway-rs/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 594161136574.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER: at-utility-eks
  NAMESPACE: at-utility

jobs:
  deploy:
    name: build, push, roll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::594161136574:role/ohm-github-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images (tag = git SHA)
        run: |
          TAG="${GITHUB_SHA::12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f Dockerfile -t "$ECR_REGISTRY/at-utility/gateway:$TAG" .
          docker build -f gateway-rs/Dockerfile -t "$ECR_REGISTRY/at-utility/gateway-rs:$TAG" gateway-rs
          docker build -f workers/Dockerfile -t "$ECR_REGISTRY/at-utility/ingest-worker:$TAG" .
          docker push "$ECR_REGISTRY/at-utility/gateway:$TAG"
          docker push "$ECR_REGISTRY/at-utility/gateway-rs:$TAG"
          docker push "$ECR_REGISTRY/at-utility/ingest-worker:$TAG"

      - name: Roll deployments
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
          kubectl -n "$NAMESPACE" set image deploy/gateway gateway="$ECR_REGISTRY/at-utility/gateway:$TAG"
          kubectl -n "$NAMESPACE" set image deploy/gateway-rs gateway-rs="$ECR_REGISTRY/at-utility/gateway-rs:$TAG"
          kubectl -n "$NAMESPACE" set image deploy/ingest-worker ingest="$ECR_REGISTRY/at-utility/ingest-worker:$TAG"
          kubectl -n "$NAMESPACE" rollout status deploy/gateway --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deploy/gateway-rs --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deploy/ingest-worker --timeout=5m

      - name: Verify live health
        run: |
          sleep 10
          curl -fsS --max-time 15 https://api.withohm.dev/health
