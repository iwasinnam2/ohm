name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # mcp extra: directory-verification tests import ohm_mcp + mcp SDK
        # workers extra: ingest worker tests import bs4/playwright
        run: pip install -e ".[dev,billing,workers,mcp]"
      - name: Test
        run: pytest -q

  rust:
    name: cargo check (gateway-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway-rs
      - name: Check
        working-directory: gateway-rs
        run: cargo check --locked
