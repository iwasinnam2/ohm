name: Golden path (nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  golden-path:
    name: reviewer path smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Walk the reviewer path
        shell: pwsh
        env:
          # Optional: a live test-tenant key enables the keyed steps
          # (chat MISS/HIT, SSE, web fetch, usage delta). Without it the
          # public surfaces are still verified.
          OHM_API_KEY: ${{ secrets.OHM_GOLDEN_PATH_KEY }}
        run: ./scripts/golden_path.ps1

      - name: Notify Observer sinks on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        run: >
          python3 scripts/observer_notify.py
          --title "golden path failed"
          --body "Nightly reviewer-path smoke went red: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
